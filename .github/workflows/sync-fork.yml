name: Sync fork with upstream

on:
  schedule:
    - cron: "0 9 * * *" # todo dia, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main from debpalash/VoiceStudio
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync "$GITHUB_REPOSITORY" --branch main
